name: Corporate site

on:
  pull_request:
    paths:
      - "web/corporate-site/**"
      - ".github/workflows/corporate-site.yml"
  push:
    branches: [main]
    paths:
      - "web/corporate-site/**"
      - ".github/workflows/corporate-site.yml"

permissions:
  contents: read

concurrency:
  group: corporate-site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web/corporate-site

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck, lint, test, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Matches the Node.js version of the Vercel project.
          node-version: 26
          cache: npm
          cache-dependency-path: web/corporate-site/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/corporate-site/playwright-report/
            web/corporate-site/test-results/
          retention-days: 7
